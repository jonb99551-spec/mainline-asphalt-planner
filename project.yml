name: Mainline
options:
  bundleIdPrefix: com.mainlineasphalt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: L6YS63G3G6
    CODE_SIGN_STYLE: Automatic
targets:
  Mainline:
    type: application
    platform: iOS
    sources:
      - Mainline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mainlineasphalt.planner
        PRODUCT_NAME: Mainline
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mainline
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Mainline App Store
    scheme:
      testTargets:
        - MainlineTests
  MainlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MainlineTests
    dependencies:
      - target: Mainline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mainlineasphalt.planner.tests
